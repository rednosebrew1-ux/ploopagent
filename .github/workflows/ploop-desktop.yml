name: ploop desktop

# Tests the ploop desktop app and builds it for macOS. Pushing a tag such as
# v0.1.0 (matching examples/ploop-desktop/package.json) also publishes the
# installers as a GitHub release.
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'examples/ploop-desktop/**'
      - 'examples/next-agent/**'
      - '.github/workflows/ploop-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter "@example/ploop-desktop^..." build

      - name: Type-check
        run: pnpm --filter @example/ploop-desktop type-check

      - name: Test
        run: pnpm --filter @example/ploop-desktop test

  mac:
    name: 'Build macOS app'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # publishes the release when a version tag is pushed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./examples/ploop-desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the app version ($expected)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter "@example/next-agent^..." build

      - name: Detect signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CSC_LINK" ]; then echo "signed=1" >> "$GITHUB_OUTPUT"; else echo "signed=0" >> "$GITHUB_OUTPUT"; fi

      - name: Bundle the app
        working-directory: examples/ploop-desktop
        env:
          PLOOP_SIGNED: ${{ steps.signing.outputs.signed }}
        run: pnpm build

      - name: Build and test ploop's server
        working-directory: examples/ploop-desktop
        run: node scripts/prepare-next.mjs

      - name: Package and publish
        working-directory: examples/ploop-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags=()
          if [ -z "$CSC_LINK" ]; then
            # No Developer ID: sign ad hoc so Apple Silicon Macs will open it.
            unset CSC_LINK CSC_KEY_PASSWORD
            flags+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          if [ -n "$APPLE_ID" ]; then
            flags+=(-c.mac.notarize=true)
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          publish=never
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then publish=always; fi
          pnpm exec electron-builder --mac --publish "$publish" "${flags[@]}"

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ploop-macos
          path: |
            examples/ploop-desktop/release/*.dmg
            examples/ploop-desktop/release/*.zip
            examples/ploop-desktop/release/latest-mac.yml
          if-no-files-found: error
